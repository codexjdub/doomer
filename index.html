<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doomer</title>
  <meta name="description" content="A fast, bloody, retro pixel-art shooter that runs in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23d8401a'/><circle cx='5.5' cy='7' r='1.3' fill='%23ffe070'/><circle cx='10.5' cy='7' r='1.3' fill='%23ffe070'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="messages"></div>
    <div id="boss" hidden>
      <div class="boss-name">The Warlord</div>
      <div class="boss-bar"><div class="boss-fill"></div></div>
    </div>
  </div>

  <div id="screen-title" class="screen">
    <div class="panel">
      <h1>Doomer</h1>
      <p class="tag">Hell broke into the base. Fight through five levels, from the hangar to the Warlord's throne.</p>
      <button class="primary" data-action="play" disabled>Loading…</button>
      <div class="skill"></div>
      <div class="levels"></div>
      <div class="controls">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</div>
        <div><kbd>Mouse</kbd> Look</div>
        <div><kbd>Click</kbd> Shoot</div>
        <div><kbd>Space</kbd> Jump</div>
        <div><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> / <kbd>Wheel</kbd> Weapons</div>
        <div><kbd>Tab</kbd> Map</div>
        <div><kbd>Esc</kbd> Pause</div>
      </div>
      <div class="settings"></div>
    </div>
  </div>

  <div id="screen-pause" class="screen" hidden>
    <div class="panel">
      <h2>Paused</h2>
      <button class="primary" data-action="resume">Resume</button>
      <button data-action="restart">Restart level</button>
      <div class="settings"></div>
    </div>
  </div>

  <div id="screen-dead" class="screen dead" hidden>
    <div class="panel">
      <h2>You died</h2>
      <p class="stats" data-stats></p>
      <button class="primary" data-action="restart">Try again</button>
    </div>
  </div>

  <div id="screen-win" class="screen win" hidden>
    <div class="panel">
      <h2 data-win-title>Level complete</h2>
      <p class="level-name" data-win-level></p>
      <p class="stats" data-stats></p>
      <button class="primary" data-action="next" data-next>Next level</button>
      <button class="primary" data-action="newgame" data-newgame hidden>Play again from level 1</button>
      <button data-action="restart">Replay level</button>
    </div>
  </div>

  <noscript><p class="noscript">Doomer needs JavaScript.</p></noscript>
  <script>
    // Explain load failures instead of sitting on "Loading…" forever.
    function doomerLoadFailed(title, html) {
      if (window.game) return;
      var b = document.querySelector('[data-action="play"]');
      b.textContent = title;
      document.querySelector('#screen-title .tag').innerHTML = html;
    }
    if (location.protocol === 'file:') {
      doomerLoadFailed('Needs a web server',
        'Browsers block games opened straight from a file. In this folder, run ' +
        '<code>python3 -m http.server 8000</code>, then open <b>http://localhost:8000</b>.');
    } else {
      setTimeout(function () {
        doomerLoadFailed('Failed to load',
          'The game code didn’t load. Check your connection, then reload.');
      }, 20000);
    }
  </script>
  <script type="module" src="src/main.js" onerror="doomerLoadFailed('Failed to load', 'The game code didn’t load. Check your connection or ad blocker, then reload.')"></script>
</body>
</html>
