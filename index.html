<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doomer</title>
  <meta name="description" content="A fast, bloody, browser-based 3D shooter.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23d8401a'/><circle cx='5.5' cy='7' r='1.3' fill='%23ffe070'/><circle cx='10.5' cy='7' r='1.3' fill='%23ffe070'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="crosshair"></div>
    <div id="messages"></div>
    <div id="boss" hidden>
      <div class="boss-name">The Warlord</div>
      <div class="boss-bar"><div class="boss-fill"></div></div>
    </div>
    <div class="hud-left">
      <div class="stat health"><span class="icon"></span><span class="val" id="hp">100</span></div>
      <div class="stat armor"><span class="icon"></span><span class="val" id="ar">0</span></div>
      <div id="keys"></div>
    </div>
    <div class="hud-right">
      <div id="slots"><span data-slot="0">1</span><span data-slot="1">2</span><span data-slot="2">3</span></div>
      <div class="ammo"><span class="val" id="ammo">50</span><span class="ammo-type" id="ammo-type">bullets</span></div>
    </div>
  </div>
  <div id="vignette"></div>
  <div id="flash"></div>

  <div id="screen-title" class="screen">
    <div class="panel">
      <h1>Doomer</h1>
      <p class="tag">Hell broke into the base. Grab a gun, find the red keycard, and put down the Warlord.</p>
      <button class="primary" data-action="play" disabled>Loading…</button>
      <div class="controls">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</div>
        <div><kbd>Mouse</kbd> Look</div>
        <div><kbd>Click</kbd> Shoot</div>
        <div><kbd>Space</kbd> Jump</div>
        <div><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> / <kbd>Wheel</kbd> Weapons</div>
        <div><kbd>Esc</kbd> Pause</div>
      </div>
      <div class="settings"></div>
    </div>
  </div>

  <div id="screen-pause" class="screen" hidden>
    <div class="panel">
      <h2>Paused</h2>
      <button class="primary" data-action="resume">Resume</button>
      <button data-action="restart">Restart level</button>
      <div class="settings"></div>
    </div>
  </div>

  <div id="screen-dead" class="screen dead" hidden>
    <div class="panel">
      <h2>You died</h2>
      <p class="stats" data-stats></p>
      <button class="primary" data-action="restart">Try again</button>
    </div>
  </div>

  <div id="screen-win" class="screen win" hidden>
    <div class="panel">
      <h2>Level complete</h2>
      <p class="stats" data-stats></p>
      <button class="primary" data-action="restart">Play again</button>
    </div>
  </div>

  <noscript><p class="noscript">Doomer needs JavaScript and WebGL.</p></noscript>
  <script>
    // Explain load failures instead of sitting on "Loading…" forever.
    function doomerLoadFailed(title, html) {
      if (window.game) return;
      var b = document.querySelector('[data-action="play"]');
      b.textContent = title;
      document.querySelector('#screen-title .tag').innerHTML = html;
    }
    if (location.protocol === 'file:') {
      doomerLoadFailed('Needs a web server',
        'Browsers block games opened straight from a file. In this folder, run ' +
        '<code>python3 -m http.server 8000</code>, then open <b>http://localhost:8000</b>.');
    } else {
      setTimeout(function () {
        doomerLoadFailed('Failed to load',
          'The game code didn’t load. Three.js comes from cdn.jsdelivr.net, so check your connection or ad blocker, then reload.');
      }, 20000);
    }
  </script>
  <script type="module" src="src/main.js" onerror="doomerLoadFailed('Failed to load', 'The game code didn’t load. Check your connection or ad blocker, then reload.')"></script>
</body>
</html>
